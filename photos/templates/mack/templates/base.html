<!doctype html>
<html lang="{{ settings.html_language }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <title>{{ album.title|striptags }} - {{ settings.title }}</title>
    <meta name="description" content="">
    <meta name="author" content="{{ album.author }}">
    <meta name="viewport" content="width=device-width">

    <link rel="stylesheet" href="{{ theme.url }}/css/pico.min.css">

    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body>
    <header class="container">
    <nav aria-label="breadcrumb">
      <ul>
        <li><a href="{{ album.index_url }}">Photos</a></li>
        {% for url, title in album.breadcrumb %}
          <li>{% if not loop.last %}<a href="{{ url }}">{% endif %}{{ title }}{% if not loop.last %}</a>{% endif %}</li>
        {% endfor %}
      </ul>
    </nav>
    </header>
    
    <main class="container">
    <div id="content">
      {% block content %}{% endblock %}
    </div>
    
    <div id="footer">
      {% block footer %}{% endblock %}
    </div>
    </main>
  </body>
</html>
